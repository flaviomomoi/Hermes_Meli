<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Mercado Livre - Autorização Concluída</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 600px; margin: 3rem auto; padding: 0 1rem; text-align: center; }
    .success { color: #16a34a; }
    .error { color: #dc2626; }
    code { background: #f1f5f9; padding: 0.2rem 0.4rem; border-radius: 4px; }
    button { margin-top: 1rem; padding: 0.75rem 1.5rem; background: #3b82f6; color: white; border: none; border-radius: 6px; cursor: pointer; }
    button:hover { background: #2563eb; }
  </style>
</head>
<body>
  <h1>🔗 Autorização Mercado Livre</h1>
  <p id="status">Processando...</p>
  <div id="tokens" style="display:none;">
    <h3>Tokens obtidos:</h3>
    <p><strong>Access Token:</strong> <code id="access_token"></code></p>
    <p><strong>Refresh Token:</strong> <code id="refresh_token"></code></p>
    <p><strong>Expira em:</strong> <span id="expires_in"></span> segundos</p>
    <button onclick="copyTokens()">Copiar tokens</button>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    const error = params.get('error');

    if (error) {
      document.getElementById('status').innerHTML = <span class="error">❌ Erro: ${error} - ${params.get('error_description') || ''}</span>;
    } else if (code) {
      document.getElementById('status').innerHTML = <span class="success">✅ Código recebido! Trocando por tokens...</span>;
      exchangeCodeForTokens(code);
    } else {
      document.getElementById('status').innerHTML = <span class="error">❌ Nenhum código recebido na URL.</span>;
    }

    async function exchangeCodeForTokens(code) {
      try {
        const resp = await fetch('https://api.mercadolibre.com/oauth/token', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded', 'Accept': 'application/json' },
          body: new URLSearchParams({
            grant_type: 'authorization_code',
            client_id: '1643821230095558',
            client_secret: 'e5ENpCMD1zftqW479wmOO6DpM2K0OgUY',
            code: code,
            redirect_uri: 'https://flaviomomoi.github.io/Hermes_Meli/callback.html'
          })
        });
        const data = await resp.json();
        if (data.access_token) {
          document.getElementById('status').innerHTML = <span class="success">✅ Tokens obtidos com sucesso!</span>`;
          document.getElementById('tokens').style.display = 'block';
          document.getElementById('access_token').textContent = data.access_token;
          document.getElementById('refresh_token').textContent = data.refresh_token;
          document.getElementById('expires_in').textContent = data.expires_in;
          // Salva no localStorage para uso posterior
          localStorage.setItem('ml_access_token', data.access_token);localStorage.setItem('ml_refresh_token', data.refresh_token);
          localStorage.setItem('ml_expires_at', Date.now() + data.expires_in * 1000);
        } else {
          throw new Error(JSON.stringify(data));
        }
      } catch (e) {
        document.getElementById('status').innerHTML = <span class="error">❌ Erro ao trocar código: ${e.message}</span>;
      }
    }

    function copyTokens() {
      const at = document.getElementById('access_token').textContent;
      const rt = document.getElementById('refresh_token').textContent;
      navigator.clipboard.writeText(Access Token: ${at}\nRefresh Token: ${rt});
      alert('Tokens copiados! Guarde em local seguro.');
    }
  </script>
</body>
</html>
