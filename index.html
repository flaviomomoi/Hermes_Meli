<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mercado Livre - Iniciar Autorização</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 600px; margin: 3rem auto; padding: 0 1rem; text-align: center; }
    .btn { display: inline-block; margin-top: 1.5rem; padding: 1rem 2rem; background: #3b82f6; color: white; border: none; border-radius: 8px; font-size: 1.1rem; cursor: pointer; text-decoration: none; }
    .btn:hover { background: #2563eb; }
    .info { margin-top: 2rem; padding: 1rem; background: #f1f5f9; border-radius: 8px; text-align: left; font-size: 0.9rem; color: #475569; }
    code { background: #e2e8f0; padding: 0.2rem 0.4rem; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>🔗 Mercado Livre OAuth</h1>
  <p>Clique no botão abaixo para autorizar a aplicação e obter os tokens de acesso.</p>

  <a id="authBtn" class="btn" href="#">Autorizar com Mercado Livre</a>

  <div class="info">
    <strong>Configuração atual:</strong><br>
    Client ID: <code>8327306475412154</code><br>
    Redirect URI: <code>https://flaviomomoi.github.io/Hermes_Meli/callback.html</code><br>
    Scopes: <code>read write offline_access</code>
  </div>

  <script>
    const CLIENT_ID = '1643821230095558';
    const REDIRECT_URI = 'https://flaviomomoi.github.io/Hermes_Meli/callback.html';
    const SCOPES = 'read write offline_access';

    const authUrl = `https://auth.mercadolivre.com.br/authorization?response_type=code&client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&scope=${encodeURIComponent(SCOPES)}`;

    document.getElementById('authBtn').href = authUrl;
  </script>
</body>
</html>
